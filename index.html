<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S-Family CRM System</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

header{
  background:#0f766e;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  margin:20px 0;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input,textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:12px;
  margin-top:10px;
  width:100%;
  border:none;
  border-radius:8px;
  background:#0f766e;
  color:white;
  cursor:pointer;
}

.whatsapp{
  background:#25D366;
}

.admin-btn{
  background:#333;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  font-size:14px;
}

th{
  background:#0f766e;
  color:white;
}

.small-btn{
  padding:5px;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <h2>S-Family Business System (CRM)</h2>
</header>

<div class="container">

<!-- FORM -->
<div class="card">
  <h2>New Service Request</h2>

  <input id="name" placeholder="Customer Name">
  <input id="phone" placeholder="Phone">
  <input id="location" placeholder="Location">
  <input id="service" placeholder="Service (Electrical / Plumbing / Solar)">
  <textarea id="issue" placeholder="Issue Description"></textarea>

  <button onclick="saveRequest()">💾 Save Request</button>
  <button class="whatsapp" onclick="sendWhatsApp()">📲 Send WhatsApp</button>
</div>

<!-- ADMIN PANEL -->
<div class="card">
  <h2>Admin Dashboard</h2>

  <button class="admin-btn" onclick="loadData()">🔄 Refresh Data</button>
  <button onclick="downloadCSV()">📥 Download CSV</button>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Service</th>
        <th>Location</th>
        <th>Issue</th>
        <th>Invoice</th>
      </tr>
    </thead>
    <tbody id="dataTable"></tbody>
  </table>
</div>

</div>

<script>

// SAVE DATA
function saveRequest(){
  let data = {
    name:document.getElementById("name").value,
    phone:document.getElementById("phone").value,
    service:document.getElementById("service").value,
    location:document.getElementById("location").value,
    issue:document.getElementById("issue").value
  };

  let records = JSON.parse(localStorage.getItem("requests") || "[]");
  records.push(data);
  localStorage.setItem("requests", JSON.stringify(records));

  alert("Request Saved!");
  loadData();
}

// LOAD DATA
function loadData(){
  let records = JSON.parse(localStorage.getItem("requests") || "[]");
  let table = document.getElementById("dataTable");
  table.innerHTML = "";

  records.forEach((r,i)=>{
    table.innerHTML += `
      <tr>
        <td>${r.name}</td>
        <td>${r.phone}</td>
        <td>${r.service}</td>
        <td>${r.location}</td>
        <td>${r.issue}</td>
        <td><button class="small-btn" onclick="invoice(${i})">Generate</button></td>
      </tr>
    `;
  });
}

// WHATSAPP
function sendWhatsApp(){
  let msg =
`New Request:
Name: ${document.getElementById("name").value}
Phone: ${document.getElementById("phone").value}
Service: ${document.getElementById("service").value}
Location: ${document.getElementById("location").value}
Issue: ${document.getElementById("issue").value}`;

  window.open("https://wa.me/254712910613?text=" + encodeURIComponent(msg));
}

// CSV DOWNLOAD
function downloadCSV(){
  let records = JSON.parse(localStorage.getItem("requests") || "[]");
  let csv = "Name,Phone,Service,Location,Issue\n";

  records.forEach(r=>{
    csv += `${r.name},${r.phone},${r.service},${r.location},${r.issue}\n`;
  });

  let blob = new Blob([csv], {type:"text/csv"});
  let url = URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "requests.csv";
  a.click();
}

// INVOICE
function invoice(i){
  let records = JSON.parse(localStorage.getItem("requests") || "[]");
  let r = records[i];

  let win = window.open();
  win.document.write(`
    <h2>INVOICE - S-Family Ltd</h2>
    <p><b>Name:</b> ${r.name}</p>
    <p><b>Phone:</b> ${r.phone}</p>
    <p><b>Service:</b> ${r.service}</p>
    <p><b>Location:</b> ${r.location}</p>
    <p><b>Issue:</b> ${r.issue}</p>
    <hr>
    <h3>Total: (Set your price manually)</h3>
  `);
}

loadData();

</script>

</body>
</html>
